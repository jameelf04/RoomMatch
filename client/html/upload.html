<!DOCTYPE HTML>
<html>
<head>
<title>RoomMatch - Upload</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="stylesheet" href="client/assets/css/main.css" />
<noscript><link rel="stylesheet" href="client/assets/css/noscript.css" /></noscript>
</head>
<body class="is-preload">

<div id="wrapper" class="fade-in">

<header id="header">
<a href="index.html" class="logo">RoomMatch</a>
</header>

<nav id="nav">
<ul class="links">
<li><a href="index.html">Home</a></li>
<li class="active"><a href="upload.html">Upload</a></li>
<li><a href="results.html">Results</a></li>
</ul>
</nav>

<div id="main">

<article class="post featured">
<header class="major">
<h2>Upload Your Room</h2>
<p>Get furniture picks matched to your style, colors, and budget</p>
</header>

<input type="file" id="room_photo" accept="image/*" />
<div id="preview_area"></div>
<div id="color_swatches"></div>

</article>

<section class="posts">
<article>
<header>
<h2>Set Your Preferences</h2>
</header>

<form id="pref_form">
<div class="fields">
<div class="field">
<label for="room_type">Room Type</label>
<select name="room_type" id="room_type">
<option value="living_room">Living Room</option>
<option value="bedroom">Bedroom</option>
</select>
</div>

<div class="field">
<label for="style_pref">Style</label>
<select name="style_pref" id="style_pref">
<option value="modern">Modern</option>
<option value="classic">Classic</option>
<option value="scandinavian">Scandinavian</option>
<option value="boho">Boho</option>
<option value="industrial">Industrial</option>
</select>
</div>

<div class="field">
<label for="budget">Budget (JOD)</label>
<input type="number" name="budget" id="budget" placeholder="e.g. 500" />
</div>

<div class="field">
<label for="region">Region</label>
<select name="region" id="region">
<option value="jordan">Jordan</option>
<option value="gcc">GCC</option>
<option value="international">International</option>
</select>
</div>
</div>

<ul class="actions">
<li><input type="button" id="submit_btn" value="Find My Furniture" /></li>
</ul>
</form>

</article>
</section>

</div>

<footer id="footer">
<p class="copyright">RoomMatch &mdash; Bootcamp Final Project</p>
</footer>

</div>

<script src="client/assets/js/jquery.min.js"></script>
<script src="client/assets/js/jquery.scrollex.min.js"></script>
<script src="client/assets/js/jquery.scrolly.min.js"></script>
<script src="client/assets/js/browser.min.js"></script>
<script src="client/assets/js/breakpoints.min.js"></script>
<script src="client/assets/js/util.js"></script>
<script src="client/assets/js/main.js"></script>
<script src="client/js/script.js"></script>
</body>
</html>
